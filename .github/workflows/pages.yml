# Проверки и публикация.
#
# Проверки идут при пуше в любую ветку: так ошибка видна до вливания в main.
# Публикация идёт только при пуше в main.
#
# Установка зависимостей не нужна: приложение и его сборка используют только
# возможности самого Node, поэтому шага с npm здесь нет.
#
# Чтобы включить Pages: в настройках репозитория → Pages → Source: GitHub Actions.
# Учтите: на бесплатном тарифе GitHub Pages доступен только для публичных репозиториев.

name: Проверки и публикация

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Группа своя для каждой ветки: новый пуш отменяет прежний прогон той же ветки,
# а прогоны разных веток друг другу не мешают.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверки расчётов и разбора ответов
        run: node --test

      - name: Сборка папки для публикации
        run: node tools/build-www.mjs

      - name: Проверка, что в сборку не попали лишние файлы
        run: |
          test -f dist/index.html
          ! find dist -name '.env*' -o -name '*.key' | grep .

      - name: Собрать папку для выкладки
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
