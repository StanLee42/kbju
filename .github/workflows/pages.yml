# Публикация на GitHub Pages: сборка и выкладка при каждом пуше в main.
#
# Установка зависимостей не нужна: приложение и его сборка используют только
# возможности самого Node, поэтому шаг с npm здесь отсутствует.
#
# Чтобы включить: в настройках репозитория → Pages → Source: GitHub Actions.
# Учтите: на бесплатном тарифе GitHub Pages доступен только для публичных репозиториев.

name: Опубликовать приложение

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверки расчётов и разбора ответов
        run: node --test

      - name: Сборка папки для публикации
        run: node tools/build-www.mjs

      - name: Проверка, что в сборку не попали лишние файлы
        run: |
          test -f dist/index.html
          ! find dist -name '.env*' -o -name '*.key' | grep .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
